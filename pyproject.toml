[project]
name = "untrainable-safe"
version = "0.1.0"
description = "Publish and download project folders with Secure Hosting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
safe = "safe_cli.__main__:main"

[tool.setuptools]
packages = ["safe_cli"]
