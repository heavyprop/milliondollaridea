[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "untrainable-safe"
version = "0.1.0"
description = "Publish and download project folders with Secure Hosting"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
safe = "safe_cli.cli:main"

[tool.setuptools]
packages = ["safe_cli"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["**/migrations/*", "docs", "private_hosting", "staticfiles"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
