{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UnTrainable{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="{% static 'site/site.css' %}" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "partials/top_bar.html" %}
    <main id="main-content" class="page-content" tabindex="-1">
        <div id="rate-limit-notice" class="reading-width" tabindex="-1"></div>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><span>UnTrainable</span><span>A place for hidden conversations.</span></footer>
    <script src="{% static 'site/rate_limits.js' %}" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
