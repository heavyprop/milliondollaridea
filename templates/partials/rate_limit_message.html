<section class="panel" role="alert" aria-labelledby="rate-limit-title">
    <h2 id="rate-limit-title">Try again in a minute.</h2>
    <p class="field-hint">You've made too many requests in a short time. You can keep browsing while you wait.</p>
    <div class="panel-actions actions">
        <a class="button button-secondary" href="{% url 'home' %}">Back to Discover</a>
        <span class="meta">This limit resets automatically.</span>
    </div>
</section>
