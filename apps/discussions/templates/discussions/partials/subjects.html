<section class="subject-index" aria-labelledby="subjects-title">
    <div class="section-heading"><h2 id="subjects-title">Subjects</h2></div>
    <p class="muted">Find your next conversation.</p>
    <ol class="subject-list">
        {% for subject in subjects %}
            <li><span class="subject-number" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span><div><h3><a href="{% url 'subject_detail' subject.id %}">{{ subject.title }}</a></h3><p>{{ subject.description|truncatechars:100 }}</p></div></li>
        {% empty %}<li class="muted">No subjects yet.</li>{% endfor %}
    </ol>
    <a class="text-link" href="{% url 'create_subject' %}">Create a subject <span aria-hidden="true">+</span></a>
</section>
