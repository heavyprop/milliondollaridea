{% extends "base.html" %}
{% block title %}Profile | UnTrainable{% endblock %}
{% block content %}
<div class="narrow-page">
    <a class="back-link" href="{% url 'home' %}">‹ Discover</a>
    <header class="page-heading"><p class="eyebrow">Your account</p><h1>Profile.</h1></header>
    <section class="panel" aria-label="Account details"><dl class="account-details"><div><dt>Username</dt><dd>{{ username }}</dd></div><div><dt>Member since</dt><dd>{{ date|date:"j F Y" }}</dd></div></dl>
    <form class="panel-actions" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="button button-secondary" type="submit">Sign out</button></form></section>
</div>
{% endblock %}
